name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: No member data in the public repo
        run: npm run check:sensitive
      - name: Type check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
